<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Financial Planning{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% if user is defined and user %}
    <nav class="navbar">
        <div class="nav-brand">Planning Tool</div>
        <div class="nav-links">
            {% if user.role.value == "client" %}
                <a href="/client/dashboard">Dashboard</a>
                <a href="/client/goals">Goals</a>
            {% elif user.role.value == "planner" %}
                <a href="/planner/pipeline">Pipeline</a>
            {% endif %}
            <span class="nav-user">{{ user.full_name }}</span>
            <a href="/logout" class="nav-logout">Logout</a>
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
